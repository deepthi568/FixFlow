spring.application.name=fixflow-backend

# Database – set MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD in the environment
# or in gitignored application-local.properties (never commit secrets).
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/fixflow}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT – set JWT_SECRET to a random string of at least 32 characters.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Initial administrator (created only if the username does not already exist).
# Example:
#   FIXFLOW_ADMIN_USERNAME=admin
#   FIXFLOW_ADMIN_PASSWORD=choose-a-strong-password
fixflow.admin.username=${FIXFLOW_ADMIN_USERNAME:}
fixflow.admin.password=${FIXFLOW_ADMIN_PASSWORD:}
fixflow.admin.full-name=${FIXFLOW_ADMIN_FULL_NAME:Administrator}

fixflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Tickets with a deadline within this many calendar days are shown as approaching.
fixflow.sla.approaching-days=${FIXFLOW_SLA_APPROACHING_DAYS:2}

spring.config.import=optional:file:./application-local.properties
