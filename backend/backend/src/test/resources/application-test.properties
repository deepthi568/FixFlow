# H2 in-memory database for unit/integration tests – no MySQL dependency
spring.datasource.url=jdbc:h2:mem:fixflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.org.hibernate.SQL=OFF

jwt.secret=test-jwt-secret-key-which-is-at-least-32-chars!
jwt.expiration-ms=3600000
fixflow.admin.username=
fixflow.admin.password=
fixflow.cors.allowed-origins=http://localhost:5173

