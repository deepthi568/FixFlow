name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test with isolated H2 profile
        working-directory: backend/backend
        run: mvn --batch-mode --no-transfer-progress -Dspring.profiles.active=test verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Run component tests
        working-directory: frontend
        run: npm test
      - name: Lint and check formatting
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
      - name: Build production assets
        working-directory: frontend
        run: npm run build
